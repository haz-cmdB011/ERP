# Revisión automática: en cada Pull Request (y en cada push a main) corre
# lint, pruebas y el build de producción. Si algo falla, el PR lo muestra en
# rojo antes de fusionarlo, y el error no llega a Vercel.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo al mismo PR cancela la revisión anterior que siga corriendo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revisar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Falla con avisos de gravedad ALTA o crítica en las dependencias que van a
      # producción. Los moderados conocidos (uuid dentro de exceljs) están
      # aceptados en SEGURIDAD.md y no la rompen.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      # El build no se conecta a Supabase (todas las páginas con datos se
      # generan al pedirlas), así que basta con valores de relleno: las claves
      # reales no se guardan en GitHub.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: 1

      # Pruebas de navegador (humo): recorren lo público de la app ya compilada con
      # Chromium, en escritorio y en celular. No usan la base ni inician sesión (ver
      # playwright.config.ts), así que bastan los mismos valores de relleno.
      - name: Instalar Chromium para las pruebas de navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas de navegador
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: 1

      # Si fallan, el informe con capturas y trazas se baja desde la pestaña del PR.
      - name: Guardar informe de las pruebas de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-de-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 7
